# Local orchestrator: the Claude Code plugin talks to the gateway (foremankit-gateway, port 8081), which sends requests
# for `local_models` to the local llama-server and everything else unchanged to the Anthropic cloud.
local_models: [claude-sonnet-5]        # "Sonnet 5" = local llama.cpp: routed to the local llama-server (in mode local); ids in model_routes go to their provider first
local_url: http://127.0.0.1:8080
local_target: local-llm                  # model name sent to llama-server (it serves one model, whatever it is called)
cloud_url: https://api.anthropic.com
port: 8081
context_tokens: 65536               # fallback only: the gateway reads the real window from the running llama-server (/props)
prompt_file: orchestrator.md           # next to this file; re-read on every request, no restart needed
language: English                     # the language the orchestrator talks to you in (fills {language} in the prompt)
                                       # Polish prompt: prompt_file: orchestrator.pl.md and language: Polish

# Only the plugin's main loop is touched: it is recognised by a tool that spawns subagents. Subagent requests
# (no such tool) pass through unchanged.
main_loop_tools: [Agent, Task]

# Requests without any tools (Claude Code's auto-mode safety check, session titles) expect a real Claude model and
# a strict answer format; the local model fails them ("Error executing tool"). They go to the cloud as this model.
# Subagents that carry tools stay local. false = send everything for local_models to the local model, as before.
side_requests_to_cloud: true
side_request_model: claude-sonnet-5-5

# The tuned local model has far less context (32k) than Claude Code's auto-compact window (100k, per model), so a
# local session that grows is spilled to the cloud instead of hitting "context exceeded": the request goes untouched
# to the same Claude model and the session keeps compacting normally. After a compaction it fits again and comes back.
# ratio = share of the llama-server window at which the spill happens (below the hook's 75 % warning).
# false = old behaviour: the request is sent to the local model and fails when the window is exceeded.
overflow_to_cloud: true
overflow_ratio: 0.70

# No-code policy for the Claude orchestrator: a cloud request whose model id starts with `claude-` and is not a Haiku
# (i.e. Sonnet/Opus, the orchestrator itself) reaches Anthropic WITHOUT its Write, Edit, MultiEdit and NotebookEdit
# tools, plus one system line telling it to use `delegate` or an Agent with model haiku. The model then cannot write
# code, so those tokens are never spent; reading, searching, Bash and tests stay available. Haiku subagents send their
# own `claude-haiku-*` id through the same gateway and keep their tools. External orchestrators (deepseek/gemini) and
# the `local` mode are not affected. false = the orchestrator may write code itself again.
no_code: true

# HARD context stop: a hook (hooks/session_length_reminder.py) only ASKS the model to hand over at 85 %, and a degraded
# local model ignores it. At `ratio` of the model window the gateway stops the turn itself: it answers "stopped, handoff
# written" (a normal tool-less assistant message, no tool_use) and writes a handoff drafted from the request body alone,
# never asking the model. It is checked BEFORE the 0.70 spill, so a session at >= ratio stops instead of growing on;
# between overflow_ratio and ratio the spill still keeps it alive on the cloud. Only requests that carry tools are gated
# (side requests such as session titles never are). Applies to local and to every external orchestrator (its `context`).
# ratio: 0.90 default, 0.95 also sensible. dir: handoff folder, empty = <state dir>/handoffs.
context_stop:
  enabled: true
  ratio: 0.90
  chars_per_token: 4        # rough size: request_chars(data) // this
  dir: ""                   # handoff-YYYYmmdd-HHMMSS.md; empty = state dir /handoffs

# Claude Code's effort slider -> does the local model think? true/false per level (sent to llama-server per request as
# chat_template_kwargs.enable_thinking, which overrides the server's start-up default). Levels not listed, and requests
# without an effort, keep that default. llama.cpp has no per-request thinking budget, so "on" means unlimited thinking.
thinking_by_effort: {low: false, medium: false, high: true, xhigh: true, max: true}

trim:
  enabled: true
  system: replace                      # replace = prompt_file + the kept sections | append = original + prompt_file | keep = untouched
  keep_sections: [Environment]         # "# Heading" sections copied from the original system prompt (cwd, platform, date)
  tools_keep:                          # names or prefix* patterns; everything else is removed from the request
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash
    - PowerShell
    - Agent
    - WebFetch
    - "mcp__foremankit__*"
    - "mcp__claude-vscode__*"
  tool_description_max_chars: 600      # long tool descriptions are cut (Bash alone is thousands of tokens); 0 = no cut
  drop_message_blocks:                 # regexes: user-message text blocks matching one are dropped (skills, MCP, agent lists)
    - 'The following skills are available'
    - '# MCP Server Instructions'
    - 'Available agent types'
    - 'deferred tools'
  old_tool_result_max_chars: 1500      # tool results older than the last `keep_recent_messages` messages are cut to this; 0 = off
  keep_recent_messages: 8

# External orchestrators: Gemini Pro / DeepSeek Pro instead of Claude when the weekly Claude limit is spent.
# Switch with `foremankit orchestrator use deepseek|gemini|claude|local` (state file orchestrator_mode), then restart
# Claude Code with ANTHROPIC_BASE_URL pointing at this gateway (`foremankit orchestrator env`). The endpoint must speak
# the Anthropic Messages API: DeepSeek has one; for Gemini run a translating proxy (LiteLLM) and put its URL here.
# An OpenAI-compatible endpoint (Ollama, llama-server's /v1/chat/completions, vLLM) is used with `format: openai`,
# which makes the gateway translate both ways; a rotating address comes from `url_env` instead of `url`.
# Model ids and URLs below are placeholders to verify against the provider's current docs.
#   ceiling: the highest repo sensitivity (.foremankit/sensitivity: normal|internal|private; missing = private) this
#            provider may see. DeepSeek trains on data and sits abroad -> normal only. Never "private".
#   provider: name of the provider in providers.yaml (defaults to the upstream name) - the single source of truth
#             for model ids and prices. A provider rename is fixed there once (run `foremankit models`).
#   models:  Claude alias the plugin asks for -> provider alias (pro / flash; side requests use the haiku one).
#   url_env: name of an environment variable holding the address, for a service whose URL changes (a tunnel); used
#            instead of `url`. Unset = the switch is refused with that variable named.
#   format:  openai = the endpoint speaks /chat/completions and the gateway translates both ways; absent = it speaks
#            the Anthropic Messages API itself.
#   context: window in tokens (the session-length hint uses it). trim: optional gateway_trim overrides (default none).
upstreams:
  deepseek:
    url: https://api.deepseek.com/anthropic
    key_env: DEEPSEEK_API_KEY
    ceiling: normal
    context: 128000
    tools_keep: &keep_tools [Read, Write, Edit, Glob, Grep, Bash, PowerShell, Agent, WebFetch, "mcp__foremankit__*", "mcp__claude-vscode__*"]
    schema: {}                       # overrides of the built-in profile (foremankit/provider_schema.py): drop_keywords, describe_keywords, ...
    models: {opus: pro, sonnet: flash, haiku: flash}
    # cheap-first: the main loop runs on flash and moves to pro after repeated tool errors, then back down after
    # a clean run. errors/clean/min_expensive_s tune the hysteresis (foremankit/escalation.py).
    escalation: {expensive: pro, errors: 2, clean: 6, min_expensive_s: 120}
  gemini:
    url: http://127.0.0.1:4000
    key_env: LITELLM_MASTER_KEY
    ceiling: internal
    context: 1000000
    tools_keep: *keep_tools
    schema: {}
    models: {opus: pro, sonnet: flash, haiku: flash}
    escalation: {expensive: pro, errors: 2, clean: 6, min_expensive_s: 120}
  kaggle:
    # The free Kaggle GPU notebook (qwen3.8:27b) as the orchestrator once the Claude limit is spent: ~30 free GPU hours
    # a week, 9 h per session. The Cloudflare quick tunnel changes with every session, so the address is read from the
    # environment - the SAME variable as nodes.yaml, so one line serves both the orchestrator and the delegated pool:
    #   FOREMANKIT_NODE_KAGGLE_LAN=https://<new-name>.trycloudflare.com     (root only, never .../v1)
    # The notebook serves Ollama, which speaks the OpenAI API only; format: openai translates every request and answer
    # into the Anthropic Messages API Claude Code expects (foremankit/openai_bridge.py).
    url_env: FOREMANKIT_NODE_KAGGLE_LAN
    key_env: KAGGLE_LLM_KEY
    format: openai                   # absent = the endpoint already speaks the Anthropic Messages API
    ceiling: internal                # our own account and disposable notebook, but the prompts DO leave this machine
    context: 32000                   # must match OLLAMA_CONTEXT_LENGTH in the notebook: Ollama silently truncates more
    tools_keep: *keep_tools
    schema: {}
    models: {opus: main, sonnet: main, haiku: main}   # provider aliases (providers.yaml `kaggle`) -> qwen3.8:27b
    # No escalation block: the notebook has one model, so cheap/expensive would cost the same.

# Per-session choice without the panel switch: a model name in the Claude Code picker goes to the upstream. DeepSeek and
# Gemini carry no static tier here: the tier (auto / flash / pro; gemini also lite31) comes from the panel's per-provider
# switch. Kaggle is a single model (`main`). Claude 5.5 names (claude-*-5-5) are not routes and always go to Anthropic.
model_routes:
  # Clear custom ids, typeable in /model (always work, regardless of the old-version names below).
  fm-deepseek: {upstream: deepseek}               # tier from the panel switch
  fm-gemini: {upstream: gemini}                   # tier from the panel switch
  fm-kaggle: {upstream: kaggle, tier: main}
  # Local LLM (claude-sonnet-5) lives in local_models. The 5.5 ids are NOT listed -> they stay on Anthropic.

# The Claude Code /model picker while the router is on (external preset): install.py writes this as `modelPicker` into
# ~/.claude/settings.json and removes it when the router turns off. replace_built_in hides the built-in lineup, so the
# picker shows Default + exactly these rows: 3 Anthropic models and 4 external providers (DeepSeek/Gemini tier comes
# from the panel selectors). `behaves_as` is the model whose capabilities (context window) the row is assumed to have.
model_picker:
  replace_built_in: true
  options:
    - {model: claude-opus-5-5, label: "Opus 5.5", description: "Anthropic"}
    - {model: claude-sonnet-5-5, label: "Sonnet 5.5", description: "Anthropic"}
    - {model: claude-haiku-5-5, label: "Haiku 5.5", description: "Anthropic"}
    - {model: fm-deepseek, label: "DeepSeek", description: "External (model: panel selector)", behaves_as: claude-sonnet-5-5}
    - {model: fm-gemini, label: "Gemini", description: "External (model: panel selector)", behaves_as: claude-sonnet-5-5}
    - {model: fm-kaggle, label: "Kaggle", description: "External, Qwen on Kaggle (32k context)", behaves_as: claude-sonnet-5-5}
    - {model: claude-sonnet-5, label: "Local LLM", description: "llama.cpp on this machine", behaves_as: claude-sonnet-5-5}

# Tool inputs / shell commands matching these globs (or stems) are refused for every external orchestrator
# (hooks/orchestrator_guard.py), e.g. exports of the process historian. Examples:
deny_globs: ["*/pi_extract*", "*.pidata*"]
