# Local orchestrator: the Claude Code plugin talks to the gateway (foremankit-gateway, port 8081), which sends requests
# for `local_models` to the local llama-server and everything else unchanged to the Anthropic cloud.
local_models: [claude-sonnet-5]        # model ids routed locally (the plugin picker entry "ForemanKit (local / DeepSeek / Gemini)"; the active orchestrator mode decides where it goes)
local_url: http://127.0.0.1:8080
local_target: local-llm                  # model name sent to llama-server (it serves one model, whatever it is called)
cloud_url: https://api.anthropic.com
port: 8081
context_tokens: 65536               # fallback only: the gateway reads the real window from the running llama-server (/props)
prompt_file: orchestrator.md           # next to this file; re-read on every request, no restart needed
language: English                     # the language the orchestrator talks to you in (fills {language} in the prompt)
                                       # Polish prompt: prompt_file: orchestrator.pl.md and language: Polish

# Only the plugin's main loop is touched: it is recognised by a tool that spawns subagents. Subagent requests
# (no such tool) and all cloud requests pass through unchanged.
main_loop_tools: [Agent, Task]

# Requests without any tools (Claude Code's auto-mode safety check, session titles) expect a real Claude model and
# a strict answer format; the local model fails them ("Error executing tool"). They go to the cloud as this model.
# Subagents that carry tools stay local. false = send everything for local_models to the local model, as before.
side_requests_to_cloud: true
side_request_model: claude-sonnet-5-5

# Claude Code's effort slider -> does the local model think? true/false per level (sent to llama-server per request as
# chat_template_kwargs.enable_thinking, which overrides the server's start-up default). Levels not listed, and requests
# without an effort, keep that default. llama.cpp has no per-request thinking budget, so "on" means unlimited thinking.
thinking_by_effort: {low: false, medium: false, high: true, xhigh: true, max: true}

trim:
  enabled: true
  system: replace                      # replace = prompt_file + the kept sections | append = original + prompt_file | keep = untouched
  keep_sections: [Environment]         # "# Heading" sections copied from the original system prompt (cwd, platform, date)
  tools_keep:                          # names or prefix* patterns; everything else is removed from the request
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash
    - PowerShell
    - Agent
    - WebFetch
    - "mcp__foremankit__*"
    - "mcp__claude-vscode__*"
  tool_description_max_chars: 600      # long tool descriptions are cut (Bash alone is thousands of tokens); 0 = no cut
  drop_message_blocks:                 # regexes: user-message text blocks matching one are dropped (skills, MCP, agent lists)
    - 'The following skills are available'
    - '# MCP Server Instructions'
    - 'Available agent types'
    - 'deferred tools'
  old_tool_result_max_chars: 1500      # tool results older than the last `keep_recent_messages` messages are cut to this; 0 = off
  keep_recent_messages: 8

# External orchestrators: Gemini Pro / DeepSeek Pro instead of Claude when the weekly Claude limit is spent.
# Switch with `foremankit orchestrator use deepseek|gemini|claude|local` (state file orchestrator_mode), then restart
# Claude Code with ANTHROPIC_BASE_URL pointing at this gateway (`foremankit orchestrator env`). The endpoint must speak
# the Anthropic Messages API: DeepSeek has one; for Gemini run a translating proxy (LiteLLM) and put its URL here.
# Model ids and URLs below are placeholders to verify against the provider's current docs.
#   ceiling: the highest repo sensitivity (.foremankit/sensitivity: normal|internal|private; missing = private) this
#            provider may see. DeepSeek trains on data and sits abroad -> normal only. Never "private".
#   provider: name of the provider in providers.yaml (defaults to the upstream name) - the single source of truth
#             for model ids and prices. A provider rename is fixed there once (run `foremankit models`).
#   models:  Claude alias the plugin asks for -> provider alias (pro / flash; side requests use the haiku one).
#   context: window in tokens (the session-length hint uses it). trim: optional gateway_trim overrides (default none).
upstreams:
  deepseek:
    url: https://api.deepseek.com/anthropic
    key_env: DEEPSEEK_API_KEY
    ceiling: normal
    context: 128000
    tools_keep: &keep_tools [Read, Write, Edit, Glob, Grep, Bash, PowerShell, Agent, WebFetch, "mcp__foremankit__*", "mcp__claude-vscode__*"]
    schema: {}                       # overrides of the built-in profile (foremankit/provider_schema.py): drop_keywords, describe_keywords, ...
    models: {opus: pro, sonnet: pro, haiku: flash}
  gemini:
    url: http://127.0.0.1:4000
    key_env: LITELLM_MASTER_KEY
    ceiling: internal
    context: 1000000
    tools_keep: *keep_tools
    schema: {}
    models: {opus: pro, sonnet: pro, haiku: flash}

# Tool inputs / shell commands matching these globs (or stems) are refused for every external orchestrator
# (hooks/orchestrator_guard.py), e.g. exports of the process historian. Examples:
deny_globs: ["*/pi_extract*", "*.pidata*"]
